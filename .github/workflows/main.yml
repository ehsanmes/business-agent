name: Daily Business Dossier Agent

on:
  schedule:
    # اجرا در ساعت 16:30 UTC (۸ شب به وقت ایران) - هر روز
    - cron: '30 16 * * *'
  workflow_dispatch: # اجازه اجرای دستی

# جلوگیری از اجرای هم‌زمان دو نسخه (و ارسال گزارش تکراری)
concurrency:
  group: business-dossier
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run the agent
        env:
          AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py
