name: Daily Business Dossier Agent

on:
  schedule:
    # GitHub often starts scheduled runs more than an hour late, so the run starts at
    # 15:30 UTC and the agent holds the report until PUBLISH_AT_UTC (17:30 UTC = 21:00 Tehran).
    - cron: '30 15 * * *'
  workflow_dispatch: # اجازه اجرای دستی
    inputs:
      dry_run:
        description: 'Only check the feeds (no AI calls, nothing sent to Telegram)'
        type: boolean
        default: false

# Prevent two runs at once (which would send a duplicate report)
concurrency:
  group: business-dossier
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Publish every other day: scheduled runs only go ahead on odd days since 1970-01-01.
      - name: Check publishing day
        id: day
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "Off day, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.day.outputs.publish == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.day.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.day.outputs.publish == 'true'
        run: pip install -r requirements.txt pytest

      - name: Run tests
        if: steps.day.outputs.publish == 'true'
        run: python -m pytest -q

      - name: Run the agent
        if: steps.day.outputs.publish == 'true'
        env:
          AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Covers the two days since the previous report.
          DAYS_TO_CHECK: '2'
          PUBLISH_AT_UTC: ${{ github.event_name == 'schedule' && '17:30' || '' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python agent.py
